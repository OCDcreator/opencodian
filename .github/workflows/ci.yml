name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Architecture gates use the same unified scope in local verify, pre-push,
  # PR and push. The base ref is resolved from the GitHub event (PR base ref or
  # push before/after), never degrading to HEAD. Phase 2 Task 9 removed the old
  # OWNER_GUARD_DIFF_RANGE / OWNER_GUARD_APPROVED env and the deprecated path
  # guard; CI now runs the architecture gates directly.
  architecture:
    runs-on: ubuntu-latest
    env:
      VERIFY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Architecture gates (manifest / boundaries / dependency-direction / cycles / approvals)
        run: npm run verify:architecture

      - name: Module doc owner impact
        run: npm run check:module-doc-owner-impact

  verify:
    runs-on: ubuntu-latest
    env:
      VERIFY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Module doc coverage and diff (scope-correct)
        run: npm run check:module-docs

      - name: Graphify freshness (content-addressed)
        run: npm run check:graphify

      - name: Devlog order
        run: npm run check:devlog-order

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check generated styles
        run: git diff --exit-code -- styles.css
