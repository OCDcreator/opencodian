name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Architecture gates use the same unified scope in local verify, pre-push,
  # PR and push. The base ref is resolved from the GitHub event: for a PR it is
  # the PR base ref; for a push it is the event 'before' SHA (the previous tip),
  # falling back to the default branch ref for a new-branch push. It never
  # degrades to HEAD, so a main push cannot collapse to an empty diff range.
  architecture:
    runs-on: ubuntu-latest
    env:
      VERIFY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Graphify
        run: |
          python -m venv .graphify-venv
          .graphify-venv/bin/python -m pip install --upgrade "graphifyy==0.9.31"
          .graphify-venv/bin/python -m graphify --version

      - name: Install dependencies
        run: npm ci

      - name: Architecture gates (manifest / boundaries / dependency-direction / cycles / approvals)
        run: npm run verify:architecture

      - name: Module doc owner impact
        run: npm run check:module-doc-owner-impact

  verify:
    runs-on: ubuntu-latest
    env:
      VERIFY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Graphify
        run: |
          python -m venv .graphify-venv
          .graphify-venv/bin/python -m pip install --upgrade "graphifyy==0.9.31"
          .graphify-venv/bin/python -m graphify --version

      - name: Install dependencies
        run: npm ci

      - name: Module doc coverage and diff (scope-correct)
        run: npm run check:module-docs

      - name: Graphify freshness (content-addressed)
        run: npm run check:graphify

      - name: Devlog order
        run: npm run check:devlog-order

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check generated styles
        run: git diff --exit-code -- styles.css
