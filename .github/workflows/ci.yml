name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  owner-guard:
    runs-on: ubuntu-latest
    env:
      OWNER_GUARD_DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || 'HEAD' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check owner guard
        run: npm run check:owner-guard

  verify:
    runs-on: ubuntu-latest
    env:
      OWNER_GUARD_DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || 'HEAD' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Module doc coverage and diff
        run: npm run check:module-docs

      - name: Graphify freshness
        run: npm run check:graphify

      - name: Devlog order
        run: npm run check:devlog-order

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check generated styles
        run: git diff --exit-code -- styles.css
