name: Plugin Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-plugin:
    runs-on: ubuntu-latest
    env:
      PLUGIN_ARTIFACT_NAME: opencodian-plugin-${{ github.sha }}
      OPENCODIAN_BUILD_ID: ci-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Graphify
        run: |
          python -m venv .graphify-venv
          .graphify-venv/bin/python -m pip install --upgrade "graphifyy==0.9.31"
          .graphify-venv/bin/python -m graphify --version

      - name: Detect version release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/detect-release-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        env:
          # Same unified scope resolution as the main CI: use the push event
          # 'before' SHA for pushes (new-branch zero-SHA falls back to main),
          # never HEAD, so a main push cannot collapse to an empty diff range.
          VERIFY_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}
        run: npm run verify

      - name: Prepare plugin three-file artifact
        run: npm run package:plugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_ARTIFACT_NAME }}
          path: artifacts/opencodian/
          if-no-files-found: error
          retention-days: 30

      - name: Guard GitHub release tag
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null)"; then
            ref_type="$(printf '%s' "$ref_json" | jq -r '.object.type')"
            ref_sha="$(printf '%s' "$ref_json" | jq -r '.object.sha')"
            if [ "$ref_type" = "tag" ]; then
              tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${ref_sha}")"
              ref_type="$(printf '%s' "$tag_json" | jq -r '.object.type')"
              ref_sha="$(printf '%s' "$tag_json" | jq -r '.object.sha')"
            fi
            test "$ref_type" = "commit"
            test "$ref_sha" = "$GITHUB_SHA"
          fi

      - name: Publish GitHub release
        if: steps.release.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: OpenCodian ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            artifacts/opencodian/main.js
            artifacts/opencodian/manifest.json
            artifacts/opencodian/styles.css
