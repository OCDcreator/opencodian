name: Plugin Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-plugin:
    runs-on: ubuntu-latest
    env:
      PLUGIN_ARTIFACT_NAME: opencodian-plugin-${{ gitea.sha }}
      OPENCODIAN_BUILD_ID: ci-${{ gitea.sha }}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Detect version release
        id: release
        if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
        env:
          RELEASE_BEFORE_SHA: ${{ gitea.event.before }}
        run: node scripts/detect-release-version.mjs

      - name: Install native Chromium for rendered tests
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends chromium

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        run: npm run verify

      - name: Prepare plugin three-file artifact
        run: npm run package:plugin

      - name: Upload plugin artifact
        uses: https://gitea.com/actions/gitea-upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_ARTIFACT_NAME }}
          path: artifacts/opencodian/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Gitea release
        if: steps.release.outputs.changed == 'true'
        env:
          GITEA_RELEASE_SERVER_URL: ${{ gitea.server_url }}
          GITEA_RELEASE_REPOSITORY: ${{ gitea.repository }}
          GITEA_RELEASE_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GITEA_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GITEA_RELEASE_TARGET_SHA: ${{ gitea.sha }}
          GITEA_RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: node scripts/publish-gitea-release.mjs
